name: Проверка расписания
on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run worker -- --once
        env:
          DATABASE_URL: ${{ secrets.SCHEDULER_DATABASE_URL }}
          CHANNEL_KEY: ${{ secrets.SCHEDULER_CHANNEL_KEY }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
